name: 'Grammar Check'
description: 'AI grammar/spelling check for LaTeX files; opens a PR with fixes.'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  provider:
    description: 'LLM provider: claude | deepseek'
    required: true
  api-key:
    description: 'API key for the chosen provider'
    required: true
  tier:
    description: 'Model tier: cheap | medium | expensive'
    required: false
    default: 'medium'
  file-extensions:
    description: 'Comma-separated file extensions to check (e.g. "tex,md"). No leading dot.'
    required: true
  max-output-tokens:
    description: 'Maximum output tokens per file. Raise for long documents that get truncated.'
    required: false
    default: '16384'
  system-prompt-append:
    description: 'Extra instructions appended to the LLM system prompt (e.g. "avoid em-dashes").'
    required: false
    default: ''
  commit-message:
    description: 'Commit message and PR title for the grammar-fix PR. Free-form; defaults to a Conventional Commits fix: message but any message is accepted.'
    required: false
    default: 'fix: grammar and spelling fixes'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for bot-only push
      id: bot-check
      shell: bash
      env:
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
      run: |
        # First push to a repo has an all-zeros BEFORE_SHA — always run.
        if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        commit_count=$(git rev-list --count "$BEFORE_SHA..$AFTER_SHA")
        bot_count=0
        # Check if every commit in the push range is authored by the bot.
        for sha in $(git rev-list "$BEFORE_SHA..$AFTER_SHA"); do
          author=$(git log -1 --format='%an' "$sha")
          if [[ "$author" == "github-actions[bot]" ]]; then
            bot_count=$((bot_count + 1))
          fi
        done

        if [[ "$bot_count" -eq "$commit_count" && "$commit_count" -gt 0 ]]; then
          echo "All $commit_count commit(s) are from the grammar-check bot — skipping."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "### Grammar check" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped: all commits in this push are from the grammar-check bot." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: astral-sh/setup-uv@v6
      if: steps.bot-check.outputs.skip != 'true'
      with:
        cache-dependency-glob: "${{ github.action_path }}/uv.lock"

    - name: Install action dependencies
      if: steps.bot-check.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: uv sync --frozen

    - name: Run grammar checker
      if: steps.bot-check.outputs.skip != 'true'
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.provider }}
        LLM_TIER: ${{ inputs.tier }}
        LLM_API_KEY: ${{ inputs.api-key }}
        FILE_EXTENSIONS: ${{ inputs.file-extensions }}
        LLM_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        SYSTEM_PROMPT_APPEND: ${{ inputs.system-prompt-append }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: uv --project "$ACTION_PATH" run python "$ACTION_PATH/main.py"

    - name: Open PR with fixes
      if: steps.bot-check.outputs.skip != 'true' && hashFiles('pr_description.md') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: grammar-fix/${{ github.sha }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH"
        git add -u
        git commit -m "$COMMIT_MESSAGE"
        git push --force origin "$BRANCH"
        gh pr create --title "$COMMIT_MESSAGE" --body-file pr_description.md
